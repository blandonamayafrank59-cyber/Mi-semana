<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C5B5FF">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Mi semana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&family=Pacifico&display=swap">
<style>
:root{--bg:#FFF0FA;--card:#fff;--ink:#34234F;--mute:#7A6A9A;--acc:#7C5FD6;--acc2:#F1EAFF;--lav:#C5B5FF;--gold:#FFD978;--warm:#FFEBB0;--plum:#B4479C;--line:#E7DCFF;--g1:#E9DFFF;--g2:#FFDDF4;--sh:0 8px 22px rgba(155,131,232,.20);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231736;--card:#33244F;--ink:#F6EEFF;--mute:#BBA9DD;--acc:#B9A5FF;--acc2:#413062;--lav:#6C57A8;--plum:#F6B8E5;--line:#4A3A72;--g1:#3B2A63;--g2:#4A2A5E;--sh:0 8px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#231736;--card:#33244F;--ink:#F6EEFF;--mute:#BBA9DD;--acc:#B9A5FF;--acc2:#413062;--lav:#6C57A8;--plum:#F6B8E5;--line:#4A3A72;--g1:#3B2A63;--g2:#4A2A5E;--sh:0 8px 22px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.45;background:radial-gradient(circle at 0 0,var(--g1) 0,transparent 45%),radial-gradient(circle at 100% 14%,var(--g2) 0,transparent 40%),var(--bg)}
main{max-width:520px;margin:0 auto;padding:16px 16px 44px}
h2{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:20px;margin:0}
.hero{position:relative;overflow:hidden;border-radius:34px;padding:22px 20px 18px;margin-bottom:16px;background:linear-gradient(135deg,#C5B5FF 0%,#E2C8F8 55%,#F6B8E5 100%);color:#34234F;box-shadow:var(--sh)}
.hero h1{font-family:'Pacifico','Fredoka',cursive;font-size:38px;font-weight:400;margin:0;line-height:1.2}
.sub{font-weight:700;margin:4px 0 14px;max-width:70%}
.dec{position:absolute;pointer-events:none;animation:float 5s ease-in-out infinite}
.d1{top:12px;right:18px;font-size:26px}.d2{top:44px;right:70px;font-size:16px;color:#fff;animation-delay:-1.5s}.d3{bottom:40px;right:12px;font-size:20px;animation-delay:-3s}.d4{top:14px;right:78px;font-size:18px;animation-delay:-2s}
.cat{position:absolute;right:20px;top:58px;font-size:42px;animation:bob 3.5s ease-in-out infinite}
.bar{height:14px;background:rgba(255,255,255,.65);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(52,35,79,.12)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#FFD978,#F6B8E5,#9B83E8);transition:width .6s cubic-bezier(.4,1.4,.5,1)}
.barl{font-size:13px;font-weight:700;margin-top:7px;color:#4A3570}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{background:var(--card);border:2px solid transparent;border-radius:20px;padding:9px 0 7px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.day small{display:block;color:var(--mute);font-size:11px;font-weight:800;text-transform:uppercase}
.day b{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:600}
.day em{display:block;font-style:normal;font-size:10px;color:var(--mute);min-height:14px;font-weight:700}
.day.today b{color:var(--acc)}
.day.today::after{content:'';display:block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:2px auto 0}
.day.sel{background:linear-gradient(160deg,#C5B5FF,#F6B8E5);border-color:#9B83E8;transform:translateY(-3px) scale(1.07);color:#34234F}
.day.sel small,.day.sel em,.day.sel.today b{color:#34234F}
.banner{background:linear-gradient(135deg,#FFE9A8,#FFD0F0);color:#34234F;border-radius:24px;padding:13px 16px;margin-bottom:12px;display:flex;gap:10px;justify-content:space-between;align-items:center;box-shadow:var(--sh);font-weight:700}
.banner span::before{content:'🔔 '}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
button{font-family:'Fredoka','Nunito',sans-serif;font-size:16px;font-weight:500;cursor:pointer;border:0;border-radius:999px;padding:11px 18px;background:linear-gradient(135deg,#9B83E8,#7C5FD6);color:#fff;box-shadow:0 6px 14px rgba(124,95,214,.32)}
button.tap{animation:tap .3s}
.ghost{background:transparent;color:var(--mute);box-shadow:none;padding:6px 10px;font-size:14px}
.soft{background:var(--acc2);color:var(--acc);box-shadow:none}
.plum{background:transparent;border:2px solid var(--plum);color:var(--plum);box-shadow:none;padding:8px 14px;font-size:14px}
.plum.on{background:linear-gradient(135deg,#F6B8E5,#C5B5FF);color:#34234F;border-color:transparent}
:focus-visible{outline:3px solid #9B83E8;outline-offset:2px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.chk{width:34px;height:34px;flex:none;border-radius:50%;border:2.5px solid var(--lav);background:transparent;padding:0;color:#fff;font-size:18px;line-height:1;box-shadow:none;display:flex;align-items:center;justify-content:center}
.task.done .chk{background:linear-gradient(135deg,#F6B8E5,#9B83E8);border-color:transparent}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.task.pop{animation:glow .7s}.task.pop .chk{animation:pop .5s}
.tt{font-weight:700;font-size:16px}
.meta{font-size:12.5px;color:var(--mute);margin-top:3px;font-weight:600}
.acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.empty{color:var(--mute);text-align:center;padding:24px 8px;font-weight:600}
.empty::before{content:'🐾';display:block;font-size:30px;margin-bottom:4px}
.note{background:var(--acc2);border:1.5px dashed var(--lav);border-radius:20px;padding:11px 14px;margin:6px 0 10px;font-size:14.5px;font-weight:600}
.add{background:var(--card);border:1.5px solid var(--line);box-shadow:var(--sh);border-radius:30px;padding:18px;margin-top:14px;display:grid;gap:12px}
.add input,.add select{font:inherit;font-weight:600;width:100%;padding:13px 14px;border-radius:18px;border:2px solid var(--line);background:var(--acc2);color:var(--ink);outline:0;transition:border-color .2s,box-shadow .2s}
.add input:focus,.add select:focus{border-color:#9B83E8;box-shadow:0 0 0 4px rgba(155,131,232,.25)}
#ad{width:100%;padding:14px;font-size:17px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:5px;font-weight:800}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.faces button{border-radius:26px;padding:14px 6px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;color:#34234F;box-shadow:var(--sh);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.faces button span{font-size:40px;line-height:1}
.faces button small{font-size:13px;font-weight:800;color:#4A3570}
.faces button:nth-child(1){background:linear-gradient(160deg,#DCD2FF,#C5B5FF)}
.faces button:nth-child(2){background:linear-gradient(160deg,#FFF0FA,#F6D9F1)}
.faces button:nth-child(3){background:linear-gradient(160deg,#FFE0F5,#F6B8E5)}
.faces button:nth-child(4){background:linear-gradient(160deg,#FFF1C2,#FFD978)}
.faces button.on{border-color:#34234F;transform:scale(1.05)}
.faces button.on span{animation:bob 1.6s ease-in-out infinite}
.spark{display:flex;gap:6px;align-items:flex-end;margin-top:12px;padding:12px 10px 8px;background:var(--acc2);border-radius:22px}
.spark div{flex:1;text-align:center;font-size:12px;color:var(--mute);line-height:1.3;font-weight:700}
.spark i{display:block;background:linear-gradient(180deg,#F6B8E5,#9B83E8);border-radius:10px 10px 5px 5px;margin-bottom:4px}
.log .task{background:linear-gradient(135deg,var(--card),var(--acc2));padding:12px 14px;border-radius:22px;align-items:center}
.log .task.done .tt{text-decoration:none;color:var(--ink)}
.log .task.star{background:linear-gradient(135deg,#FFF6D6,#FFE3F6)}
.log .task.star .tt{color:#34234F}
.log .meta{text-align:center;background:var(--acc2);border-radius:99px;padding:6px 12px;font-weight:800;color:var(--acc)}
.foot{font-size:12.5px;color:var(--mute);margin-top:20px;text-align:center;font-weight:600}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,217,120,.9)}100%{box-shadow:0 0 0 18px rgba(255,217,120,0)}}
@keyframes float{50%{transform:translateY(-7px) rotate(8deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes tap{50%{transform:scale(.92)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="hero"><span class="dec d1">🌸</span><span class="dec d4">✦</span><span class="dec d2">✦</span><span class="dec d3">💜</span><div class="cat">🐱</div><h1>Mi Semana</h1>
  <p class="sub" id="sb"></p>
  <div class="bar"><i id="pb"></i></div>
  <div class="barl" id="pl"></div></header>
  <div class="week" id="week"></div>
  <div id="ban"></div>
  <div class="top">
    <h2 id="dt"></h2>
    <button class="plum" id="hv">Día pesado</button>
  </div>
  <div id="list"></div>
  <div class="add" id="mi">
    <h2>Mi día 💜</h2>
    <div><label>¿Cómo me siento hoy?</label><div class="faces" id="fc"></div><div id="tip"></div></div>
    <div><label for="sp">Pasos de hoy (míralos en la app de salud de tu celular)</label>
      <div class="row"><input id="sp" type="number" min="0" inputmode="numeric" placeholder="Ej: 1500"><button id="ss">Guardar</button></div>
      <div id="sm"></div>
      <div class="spark" id="sk"></div></div>
  </div>
  <div class="add log" id="hoy" style="margin-top:14px">
    <div class="top"><h2>Mis pequeñas victorias ✨</h2><button class="plum" id="rs">Hoy descansé</button></div>
    <div id="hl"></div>
    <div class="row" style="grid-template-columns:1fr auto"><input id="ex" maxlength="80" placeholder="Algo que hice de más ⭐"><button id="ea">⭐</button></div>
  </div>
  <div class="add" style="margin-top:14px">
    <h2>Nueva tarea 🌸</h2>
    <div><label for="nt">¿Qué quieres hacer?</label><input id="nt" placeholder="Ej: lavar la ropa y sacarla a secar" maxlength="80"></div>
    <div class="row">
      <div><label for="nl">Debe estar lista</label>
        <select id="nl"><option value="">Sin límite</option><option value="antes del mediodía">Antes del mediodía</option><option value="antes de la tarde">Antes de la tarde</option><option value="antes de dormir">Antes de dormir</option></select></div>
      <div><label for="nk">Tipo</label>
        <select id="nk"><option>Casa</option><option>Venta</option><option>Ejercicio</option><option>Distraerme</option></select></div>
    </div>
    <div><label for="nr">Recordarme a las (opcional)</label><input id="nr" type="time"></div>
    <div id="warn"></div>
    <button id="ad">Agregar</button>
  </div>
  <div class="foot">Los avisos suenan mientras tengas esta página abierta.<br><button class="ghost" id="nf">Activar avisos del celular</button></div>
</main>
<script>
(function(){
var POP=0,KEY='miSemana1',S={tasks:[],heavy:{}},sel,warned=false;
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var now=new Date(),today=iso(now),NM=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
var days=[];for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);days.push({k:iso(d),n:d.getDate(),w:NM[d.getDay()]})}
load();S.mood=S.mood||{};S.log=S.log||{};S.rest=S.rest||{};S.steps=S.steps||{};
S.tasks.forEach(function(t){if(!t.done&&t.d<today){t.d=today;t.c=1}});
sel=today;if(days.every(function(x){return x.k!==today}))sel=days[0].k;
save();
function $(i){return document.getElementById(i)}
function dayTasks(k){return S.tasks.filter(function(t){return t.d===k})}
function render(){
  var tot=S.tasks.filter(function(t){return days.some(function(x){return x.k===t.d})}),dn=tot.filter(function(t){return t.done}).length;
  $('pb').style.width=(tot.length?dn/tot.length*100:0)+'%';
  $('pl').textContent=tot.length?dn+' de '+tot.length+' cosas hechas esta semana':'Aún no hay tareas esta semana';
  $('week').innerHTML=days.map(function(x){var t=dayTasks(x.k),h=t.filter(function(y){return y.done}).length;
    return '<button class="day'+(x.k===sel?' sel':'')+(x.k===today?' today':'')+'" data-k="'+x.k+'"><small>'+x.w+'</small><b>'+x.n+'</b><em>'+(t.length?h+'/'+t.length:'')+'</em></button>'}).join('');
  var heavy=!!S.heavy[sel],all=dayTasks(sel),shown=all,hidden=0;
  if(heavy){var f=false;shown=all.filter(function(t){if(t.done)return true;if(!f){f=true;return true}return false});hidden=all.length-shown.length}
  var cur=days.filter(function(x){return x.k===sel})[0];
  $('dt').textContent=(sel===today?'Hoy, ':'')+cur.w+' '+cur.n;
  $('hv').className='plum'+(heavy?' on':'');
  var h='';
  if(heavy)h+='<div class="note">Día pesado: solo la primera tarea. Con esa, el día ya cuenta.'+(hidden?' ('+hidden+' guardadas para después)':'')+'</div>';
  if(all.length&&all.every(function(t){return t.done}))h+='<div class="note">Listo por hoy. Descansa, te lo ganaste 💜</div>';
  if(!shown.length)h+='<div class="empty">Nada para este día. Agrega una cosita pequeña.</div>';
  shown.forEach(function(t){
    var m=[t.kind];if(t.lim)m.push(t.lim);if(t.r)m.push('aviso '+t.r);if(t.c)m.push('pasó de antes');
    h+='<div class="task'+(t.done?' done':'')+(t.id===POP?' pop':'')+'"><button class="chk" data-a="c" data-i="'+t.id+'" aria-label="Marcar hecha">'+(t.done?'✓':'')+'</button><div><div class="tt">'+esc(t.t)+'</div><div class="meta">'+esc(m.join(' · '))+'</div></div><div class="acts">'+(t.done?'':'<button class="ghost" data-a="m" data-i="'+t.id+'">Pasar a mañana</button>')+'<button class="ghost" data-a="x" data-i="'+t.id+'" aria-label="Borrar">Borrar</button></div></div>'});
  $('list').innerHTML=h;renderHoy();
}
function nextDay(k){var i=days.findIndex(function(x){return x.k===k});return i>-1&&i<6?days[i+1].k:null}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){sel=b.dataset.k;warned=false;$('warn').innerHTML='';render();return}
  var id=+b.dataset.i,t=S.tasks.filter(function(x){return x.id===id})[0];
  if(b.dataset.a==='c'&&t){t.done=!t.done;POP=t.done?id:0;save();render();POP=0}
  if(b.dataset.a==='x'){S.tasks=S.tasks.filter(function(x){return x.id!==id});save();render()}
  if(b.dataset.a==='m'&&t){var n=nextDay(t.d);if(n){t.d=n;save();render()}else{t.d=days[0].k;save();render()}}
});
$('hv').onclick=function(){S.heavy[sel]=!S.heavy[sel];save();render()};
$('ad').onclick=function(){
  var v=$('nt').value.trim();if(!v){$('warn').innerHTML='<div class="note">Escribe qué quieres hacer.</div>';return}
  if(dayTasks(sel).length>=3&&!warned){warned=true;$('warn').innerHTML='<div class="note">Este día ya tiene 3 tareas. Quizás es mejor ponerla en otro día. Toca otra vez para agregarla igual.</div>';$('ad').textContent='Agregar igual';return}
  S.tasks.push({id:Date.now(),t:v,d:sel,lim:$('nl').value,kind:$('nk').value,r:$('nr').value,done:false});
  $('nt').value='';$('nr').value='';warned=false;$('warn').innerHTML='';$('ad').textContent='Agregar';save();render()};
$('nf').onclick=function(){try{Notification.requestPermission().then(function(p){$('nf').textContent=p==='granted'?'Avisos activados':'No se pudieron activar'})}catch(e){$('nf').textContent='Este navegador no permite avisos'}};
function ban(t){$('ban').innerHTML='<div class="banner"><span>Recordatorio: <b>'+esc(t.t)+'</b>. Sin prisa, cuando puedas.</span><button class="soft" id="bx">Ok</button></div>';$('bx').onclick=function(){$('ban').innerHTML=''};
  try{if(navigator.vibrate)navigator.vibrate(200);if(Notification.permission==='granted')new Notification('Recordatorio',{body:t.t})}catch(e){}}
setInterval(function(){var d=new Date(),hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2),k=iso(d);
  S.tasks.forEach(function(t){if(!t.done&&t.r&&t.d===k&&t.r<=hm&&t.n!==k){t.n=k;save();ban(t)}})},15000);
var F=[{k:1,e:'🥺',l:'Mal'},{k:2,e:'😌',l:'Regular'},{k:3,e:'😊',l:'Mejor'},{k:4,e:'🥰',l:'Con ánimo'}];
var T={1:['Hoy puede ser un día de lo mínimo: tomar agua, comer algo y una sola tarea chiquita. Sentirte mal hoy no borra lo que has avanzado.','Hoy toca ir suave. Respira lento tres veces y haz solo lo primero de tu lista.'],
2:['Un día regular también es un día. Prueba con una tarea de 2 minutos y mira cómo te sientes después.','Ni bien ni mal: así también se avanza. Toma agua y estírate un ratito si puedes.'],
3:['¡Qué bueno! Aprovecha para hacer algo que te guste, sin exigirte de más.','Notar que estás mejor es un logro. Recuerda cómo se siente este día para los días difíciles.'],
4:['¡Qué lindo! Disfruta la energía sin pasarte: haz algo que te cueste y descansa después.','Con ánimo es buen momento para ordenar un rinconcito o caminar un poquito. Poquito a poquito.']};
function renderDia(){
  var m=S.mood[today];
  $('fc').innerHTML=F.map(function(f){return '<button data-f="'+f.k+'" class="'+(m===f.k?'on':'')+'"><span>'+f.e+'</span><small>'+f.l+'</small></button>'}).join('');
  var tip='';if(m){tip=T[m][now.getDate()%2];if(m===1)tip+=' Si se siente demasiado fuerte, no tienes que cargarlo en soledad: habla hoy con alguien de confianza o con una línea de ayuda de tu país.'}
  $('tip').innerHTML=tip?'<div class="note">'+esc(tip)+'</div>':'';
  if(S.steps[today]!=null&&document.activeElement!==$('sp'))$('sp').value=S.steps[today];
  var mx=Math.max.apply(null,days.map(function(x){return S.steps[x.k]||0}).concat(1));
  $('sk').innerHTML=days.map(function(x){var v=S.steps[x.k]||0,mm=S.mood[x.k];return '<div><i style="height:'+Math.max(4,v/mx*50)+'px"></i>'+(mm?F[mm-1].e:'·')+'<br>'+x.w[0]+'</div>'}).join('');
}
$('fc').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.mood[today]=+b.dataset.f;save();renderDia()};
$('ss').onclick=function(){var v=parseInt($('sp').value,10);if(isNaN(v)||v<0)return;S.steps[today]=v;save();
  var prev=null;Object.keys(S.steps).sort().forEach(function(k){if(k<today&&S.steps[k]>0)prev=S.steps[k]});
  var msg=prev===null?'Gracias por anotarlo. Así podrás ver cómo vas avanzando.':v>prev?'Hoy caminaste más que la última vez que anotaste. Un pasito más también es avanzar 💜':'Hoy fue un día más tranquilo, y está bien. Cada día cuenta distinto.';
  $('sm').innerHTML='<div class="note">'+msg+'</div>';renderDia()};
function renderHoy(){
  var done=S.tasks.filter(function(t){return t.done&&t.d===today}),ex=S.log[today]||[],h='',n=done.length+ex.length;
  if(S.rest[today])h+='<div class="note">Hoy descansaste. Descansar también es cuidarte 💜</div>';
  done.forEach(function(t){h+='<div class="task done"><span style="font-size:22px">✅</span><div class="tt">'+esc(t.t)+'</div></div>'});
  ex.forEach(function(x){h+='<div class="task done star"><span style="font-size:22px">⭐</span><div class="tt">'+esc(x.t)+'</div><div class="acts"><button class="ghost" data-xd="'+x.id+'">Borrar</button></div></div>'});
  if(!n&&!S.rest[today])h+='<div class="empty">Aquí aparece todo lo que hagas hoy, planeado o no.</div>';
  if(n)h+='<div class="meta">Hoy llevas '+n+(n===1?' cosa':' cosas')+' 💜</div>';
  $('hl').innerHTML=h;$('rs').className='plum'+(S.rest[today]?' on':'');
}
$('ea').onclick=function(){var v=$('ex').value.trim();if(!v)return;(S.log[today]=S.log[today]||[]).push({id:Date.now(),t:v});$('ex').value='';save();renderHoy()};
$('ex').onkeydown=function(e){if(e.key==='Enter')$('ea').onclick()};
$('rs').onclick=function(){S.rest[today]=!S.rest[today];save();renderHoy()};
$('hl').onclick=function(e){var b=e.target.closest('button');if(!b||!b.dataset.xd)return;var id=+b.dataset.xd;S.log[today]=(S.log[today]||[]).filter(function(x){return x.id!==id});save();renderHoy()};
var hr=now.getHours();$('sb').textContent=(hr<12?'☀️ Buenos días':hr<19?'🌸 Buenas tardes':'🌙 Buenas noches')+'. Hoy solo lo que puedas, poquito a poquito.';
document.addEventListener('click',function(e){var b=e.target.closest('button');if(b){b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap')}});
renderDia();render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}</script>
</body>
